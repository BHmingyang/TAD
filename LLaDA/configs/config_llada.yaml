# config.yaml
model:
  name: "LLaDA Path"
  trust_remote_code: true
  torch_dtype: "bfloat16"

training:
  output_dir: "output_model/TAD-LLaDA"
  num_train_epochs: 1
  gradient_accumulation_steps: 8
  per_device_train_batch_size: 4
  logging_steps: 10
  learning_rate: 0.00002
  weight_decay: 0.01
  bf16: True
  optim: "adamw_torch"
  # warmup_ratio: 0.05
  max_grad_norm: 1
  group_by_length: False
  lr_scheduler_type: "constant"
  save_strategy: "epoch"

lora:
  r: 128
  lora_alpha: 128
  target_modules: 
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
data:
  sample_ratio: 1.0
